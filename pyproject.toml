[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stepstone-mcp-connector"
version = "0.1.0"
description = "StepStone HTML parsing and robots-aware, read-only MCP access with explicit coverage limits."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [{name = "Ahmed Elkashef"}]
dependencies = ["beautifulsoup4>=4.12,<5", "httpx>=0.27,<1", "mcp>=1.12,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
stepstone-mcp = "stepstone_mcp.server:main"
stepstone-inspect = "stepstone_mcp.cli:main"

[project.urls]
Repository = "https://github.com/ahmed-elkashef/stepstone-mcp"
Issues = "https://github.com/ahmed-elkashef/stepstone-mcp/issues"

[tool.setuptools.packages.find]
include = ["stepstone_mcp*"]

[tool.setuptools.package-data]
stepstone_mcp = ["*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
